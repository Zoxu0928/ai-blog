# Site
title: 我的博客
subtitle: ''
description: ''
keywords:
author: 你的名字
language: zh-CN
timezone: ''

# URL
url: https://blog.xxx.com
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_fallback: false
show_future: true
marked:
  enable: false

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
exclude: []

# Output
# Deploy
deploy:
  type: ''

# Theme
theme: butterfly